name: Build and publish update

# Every push to main builds a signed APK and republishes it as the GitHub release tagged "appUpdate".
# The app checks that release and offers the APK when its build number is higher than the installed one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease --no-daemon
          -PversionCode=${{ github.run_number }}
          -PversionName=1.0.${{ github.run_number }}
          -PGITHUB_REPO=${{ github.repository }}

      - name: Publish "appUpdate" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "DoctorCalendar-${{ github.run_number }}.apk"
          gh release delete appUpdate --cleanup-tag --yes || true
          gh release create appUpdate "DoctorCalendar-${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" \
            --title "Doctor Calendar 1.0.${{ github.run_number }}" \
            --notes "Automated build ${{ github.run_number }} of ${{ github.sha }}"
